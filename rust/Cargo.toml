[package]
name = "shirolyzer"
version = "0.1.0"
edition = "2021"
description = "Rust rewrite of the shirolyzer layout analyzer and generator"
license = "MIT"

[[bin]]
name = "shirolyzer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
lzma-rs = "0.3"
unicode-normalization = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
