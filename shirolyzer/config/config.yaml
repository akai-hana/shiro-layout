# Conditions are evaluated from top to bottom; the first matching entry wins.
# `allow: false` forbids a matching scissor, `allow: true` permits it.
# If `reverse` is omitted or false, the rule matches both regular and reverse
# scissors; `reverse: true` matches only the reverse direction.
# `fingers` matches when either endpoint is in the set.  Use `pairs` for an
# exact two-finger match, e.g. `pairs: [[LR, LP], [RR, RP]]` matches only
# ring/pinky pairs (in either direction).
#
# The calibrated model already implements its native geometry rules, so this
# list is reserved for user-added overrides.  The shipped native defaults are
# kept here for reference (they are not active unless copied into the list):
#   - {type: scissors, distance: full, reverse: true, fingers: [LP, LR, LM, RM, RR, RP], allow: false}
#   - {type: scissors, distance: half, fingers: [LP, RP], allow: false}
#   - {type: scissors, distance: half, allow: true}
#   - {type: spread, max_extra: 2.0, allow: false}
#   - {type: separation, min_width: 1.9, fingers: [LP, LI], allow: false}
#   - {type: crossing, deficit: 0.30, allow: false}
conditions:
  - {type: scissors, distance: half, reverse: true, pairs: [[LR, LP], [RR, RP]], allow: false}
  - {type: scissors, distance: full, reverse: true, pairs: [[LR, LP], [RR, RP]], allow: false}

# Tiered priority list.
# High to low, most to least important in consideration.
# Items grouped together share a tier. Tiers are weighted relative to the
# default ordering: with N tiers, tier t (0 = highest) is multiplied by
# 1 + 0.5 * (N - t - 1). The default ordering is left unweighted (all 1.0).
priority_list:
  - sfbs-sfts # sfb/ts are the unavoidable devil
  - [scissors, redirects] # flow disruptions that are bad to have
  - [rolls, alternation] # flow improving niceties
  # - finger_balance # balance doesn't matter to me

# Target share of strokes per finger in percent. The calibrated model uses the
# same target for both hands: P 9%, R 12.5%, M 14%, I 14.5%.
finger_balance:
  LP: 9
  LR: 12.5
  LM: 14
  LI: 14.5
  RP: 9
  RR: 12.5
  RM: 14
  RI: 14.5
# = 100
