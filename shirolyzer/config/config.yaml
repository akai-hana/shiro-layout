# <>|> Shirolyzer user config! <~=| #

# This file is the single source of truth for the physical layout, corpus
# roles, fingermap, permitted alt fingers, geometric conditions, objective
# priorities, and target finger balance.  Fitted model parameters stay in the
# parameter file referenced by `model`.
#
# Fingermap tokens are hand/finger pairs in physical-key order:
# LP/LR/LM/LI on the left hand and RI/RM/RR/RP on the right hand.
# Internally the tokens map to eight finger states ordered by
# `hand * 4 + finger` (LP=0, LR=1, LM=2, LI=3, RP=4, RR=5, RM=6, RI=7).
# The default fingermap is same-hand: each key's finger belongs to that key's
# hand.  Cross-hand fingering is opt-in through `alt_fingers` below.
# Physical key order is defined by the geometry file.

# Search effort defaults live in commands/compute.py: 28 random runs, 100000
# anneal iterations, and 8 ILS rounds.  They were calibrated in
# results/calibration/REPORT.md; override per run with --runs/--iters/--ils.
# --time-budget stays optional because short budgets truncate seeds and ILS.
# Diversity output also lives in commands/compute.py: 0.002 primary tolerance,
# 0.005 secondary tolerance, 4 key positions minimum distance, 8 valid layouts.
# --polish-rounds is opt-in because it continues optimizing near-equal picks.
general:
  geometry: geometry/ansi.yaml
  # Non-letter characters placed by compute.  Letters occupy the other 26
  # physical keys, so these four characters are permuted across the remaining
  # positions.  analyze uses the most recent compute result when --layout is
  # omitted.
  punctuation: ";,./"
  primary_corpus:
    - {name: shai, weight: 100}
  secondary_corpus:
    - {name: douglas, weight: 100}
  primary_sacrifice:
    score: 0.00023%            # percent of the best primary score
    sfbs: 1%                   # combined SFB and SFT degradation
    scissors: 1%
    redirects: 1%
    rolls: 1%
    alternation: 1%
    finger_balance: 1%

model:
  # Fitted model parameters.  The reverse-scissor list names finger pairs whose
  # full-span reverse scissors are disallowed; MR means middle/ring (both
  # directions), and an empty list leaves all pairs to the fitted geometry.
  parameters_file: model/pattern_parameters_A_all.json
  disallow_reverse_scissors: [MR]

fingermap: |
  LR LR LM LM LM  RM RM RM RR RR
  LP LR LM LI LI  RI RI RM RR RP
  LP LR LI LI LI  RI RI RR RR RP

# Optional search restriction: characters listed under `left` or `right` may
# only be placed on keys of that hand by `compute`. Unlisted characters are
# free. Empty lists disable the restriction.
hand_restrictions:
  left: []
  right: []

# Alt-finger ngram rules.  Each entry names an ordered sequence of QWERTY
# physical keys (`ngram`) and the finger used for each key (`fingers`).
# mode=allow : only the listed fingering is considered for this ngram
# mode=block : exactly the listed fingering is forbidden for this ngram
# A rule applies only while its ngram occurs in the typed sequence.  A longer
# rule overrides any shorter rule that overlaps it.  Fingers are written as
# hand/finger pairs (LP/LR/LM/LI/RI/RM/RR/RP).  A bare P/R/M/I uses the physical
# key's own hand, while an explicit L/R token opts into cross-hand fingering,
# e.g. `{ngram: [H], fingers: [LI], mode: allow}` for H typed with the left
# index finger.  Cross-hand travel is priced from absolute key/finger positions
# and is never enabled implicitly.  Repeated definitions of the same ngram are
# tried in order; later entries are fallbacks used only when the earlier
# fingering is impossible.
#
# The list below was translated from the calibrated GATES_ALL table.  Context
# keys prefer their default finger, with the other fingers of that hand listed
# afterwards as fallbacks.  The target key keeps the finger from the old gate.
# Unigram block entries preserve the old "only in this context" restriction.
alt_fingers:
  - {ngram: [C, X], fingers: [LI, LM], mode: allow}
  - {ngram: [C, X], fingers: [LP, LM], mode: allow}
  - {ngram: [C, X], fingers: [LR, LM], mode: allow}
  - {ngram: [C, X], fingers: [LM, LM], mode: allow}
  - {ngram: [X, C], fingers: [LM, LI], mode: allow}
  - {ngram: [X, C], fingers: [LM, LP], mode: allow}
  - {ngram: [X, C], fingers: [LM, LR], mode: allow}
  - {ngram: [X, C], fingers: [LM, LM], mode: allow}
  - {ngram: [A, X], fingers: [LR, LI], mode: allow}
  - {ngram: [A, X], fingers: [LR, LM], mode: allow}
  - {ngram: [A, X], fingers: [LM, LI], mode: allow}
  - {ngram: [A, X], fingers: [LP, LM], mode: allow}
  - {ngram: [X, A], fingers: [LI, LR], mode: allow}
  - {ngram: [X, A], fingers: [LM, LR], mode: allow}
  - {ngram: [X, A], fingers: [LI, LM], mode: allow}
  - {ngram: [X, A], fingers: [LM, LP], mode: allow}
  - {ngram: [X, A], fingers: [LM, LR], mode: block}
  - {ngram: [X], fingers: [LM], mode: block}
  - {ngram: [Q, W], fingers: [LR, LM], mode: allow}
