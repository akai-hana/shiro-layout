# Conditions are evaluated from top to bottom; the first matching entry wins.
# `allow: false` forbids a matching scissor, `allow: true` permits it.
# If `reverse` is omitted or false, the rule matches both regular and reverse
# scissors; `reverse: true` matches only the reverse direction.
# `fingers` matches when either endpoint is in the set.  Use `pairs` for an
# exact two-finger match, e.g. `pairs: [[LR, LP], [RR, RP]]` matches only
# ring/pinky pairs (in either direction).
#
# The calibrated model already implements its native geometry rules, so this
# list is reserved for user-added overrides.  The shipped native defaults are
# kept here for reference (they are not active unless copied into the list):
#   - {type: scissors, distance: full, reverse: true, fingers: [LP, LR, LM, RM, RR, RP], allow: false}
#   - {type: scissors, distance: half, fingers: [LP, RP], allow: false}
#   - {type: scissors, distance: half, allow: true}
#   - {type: spread, max_extra: 2.0, allow: false}
#   - {type: separation, min_width: 1.9, fingers: [LP, LI], allow: false}
#   - {type: crossing, deficit: 0.30, allow: false}
conditions:
  - {type: scissors, distance: half, reverse: true, pairs: [[LR, LP], [RR, RP]], allow: false}
  - {type: scissors, distance: full, reverse: true, pairs: [[LR, LP], [RR, RP]], allow: false}

# Tiered priority list.
# High to low, most to least important in consideration.
# Items grouped together share a tier. With N tiers, tier t (0 = highest) is
# multiplied by 1 + 0.5 * (N - t - 1).  The list is always applied as written:
# to weight every term equally, put them all in a single tier.  A term left out
# of the list is switched off entirely (multiplier 0).  The effective
# multipliers are printed at the top of every `compute` run.
#
# Avoid, worst first: SFBs/SFTs, then scissors, then redirects.
# Seek: rolls together with finger strength (finger_balance), then alternation.
priority_list:
  - sfbs-sfts # same-finger bigrams/trigrams: the unavoidable devil
  - scissors # awkward stretches; harmless ones already cost nothing
  - redirects # flow breakers, worst to least bad (see redirect_tiers)
  - [rolls, finger_balance] # comfortable rolls, carried by the strong fingers
  - alternation # nice to have, one tier below rolls

# Redirect preferences. Tiers are ordered from most preferred (tier 1) to most
# avoided (last tier). Fingers are numbered per hand: 1=index, 2=middle,
# 3=ring, 4=pinky. Each entry is a same-hand finger sequence whose first and
# third fingers differ in direction from the middle (for example 1-2-1).
# Unlisted same-hand turns keep the legacy redirect cost.
redirect_tiers:
  - ["1-2-1", "2-1-2", "1-3-1", "3-1-3"]
  - ["3-2-3"]
  - ["2-1-3", "3-1-2", "2-3-2", "1-4-1"]
  - ["4-1-4", "4-2-4", "2-4-2"]
  - ["3-4-3", "4-3-4", "3-2-4", "4-2-3"]

# Extra multiplier on every redirect cost, on top of the `redirects` priority
# tier (1.0 = none).  The tier weights alone leave redirects cheap next to the
# roll and alternation rewards, and the best layouts then carry about 5.5% of
# trigrams as redirects; 3.0 brings that down to about 2.5% (stable up to 3.5).
redirect_scale: 3.0

# Roll preferences.  Tiers run from most preferred (tier 1) to least preferred.
# Each entry is a directed same-hand finger pair "from-to" using per-hand
# ranks: 1=index, 2=middle, 3=ring, 4=pinky, so "1-2" is index then middle and
# "2-1" is middle then index.  Only neighbouring fingers can roll.  With N
# tiers, tier t (0 = highest) earns a roll credit of -0.60 * (N - t) / N per
# pair, scaled by the `rolls` priority.  Listed pairs replace the model's own
# roll weight (r_MI, r_RM_*, r_PR_*); unlisted pairs keep it.  The model's
# unlisted bias grows with the weaker finger: index<->middle is a tie,
# ring->middle is slightly preferred, and pinky->ring is strongly preferred.
roll_tiers:
  - ["1-2", "2-1"]

# Target share of strokes per finger in percent. The calibrated model uses the
# same target for both hands: P 9%, R 12.5%, M 14%, I 14.5%.
finger_balance:
  LP: 9
  LR: 12.5
  LM: 14
  LI: 14.5
  RP: 9
  RR: 12.5
  RM: 14
  RI: 14.5
# = 100

# Which fingering supplies the finger-balance loads.  "chosen" uses the same
# trigram-DP fingers reported by `analyze`, including allowed alt_fingers and
# reachable alternatives; "default" uses the physical fingermap only.  Both
# respect allow/block and reachability.  The penalty is switched off when
# finger_balance is missing from priority_list.
finger_balance_source: chosen

# Optional per-finger strength penalty (cost units added to every key press).
# Higher values steer the search away from weak fingers.  Bare P/R/M/I apply
# to both hands; explicit LP/LR/LM/LI/RP/RR/RM/RI override one hand.  Values
# must be non-negative and default to 0 (off).
# finger_strength:
#   LP: 0.30
#   LR: 0.10
#   RP: 0.45
#   RR: 0.15
